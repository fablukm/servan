[project]
name = "servan"
version = "0.1.0"
description = "House spirit for multi-agent coding: scaffolds, syncs, and audits OpenCode+Ollama role teams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "pydantic>=2.7", "pyyaml>=6"]

[project.scripts]
servan = "servan.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servan"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "servan.watch.WatchOptions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
